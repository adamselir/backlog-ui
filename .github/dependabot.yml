version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # Collapse routine churn into one PR per ecosystem per week. Security
    # updates deliberately stay ungrouped (applies-to: version-updates) so they
    # arrive as their own legible PR.
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # Collapse routine churn into one PR per ecosystem per week. Security
    # updates deliberately stay ungrouped (applies-to: version-updates) so they
    # arrive as their own legible PR.
    groups:
      actions-all:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    # Collapse routine churn into one PR per ecosystem per week. Security
    # updates deliberately stay ungrouped (applies-to: version-updates) so they
    # arrive as their own legible PR.
    groups:
      docker-all:
        applies-to: version-updates
        update-types:
          - minor
          - patch
